
name: CI-CD RESTCONF

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Build - lint
        run: |
          yamllint config .github
          flake8 src tests --max-line-length 100

      - name: Test - unitarias
        run: pytest -q

  deploy:
    needs: build-test
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted

    env:
      SANDBOX_USER: ${{ secrets.SANDBOX_USER }}
      SANDBOX_PASS: ${{ secrets.SANDBOX_PASS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Test - prueba en seco
        run: python src/deploy.py --check

      - name: Deploy - aplicar configuracion
        run: python src/deploy.py

      - name: Monitor - verificar configuracion
        run: python src/verify.py
